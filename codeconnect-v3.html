<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeConnect India</title>
<style>
:root{--bg:#0a0e1a;--s:#121829;--s2:#1a2238;--line:#262f48;--txt:#eef1ff;--mut:#8f99b8;--blue:#3b82f6;--vio:#8b5cf6;--red:#f43f5e;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);padding:56px 0 64px}
#net{position:fixed;inset:0;z-index:-1;opacity:1}
button,input,textarea,select{font:inherit}
.top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
.logo{font-weight:800;font-size:19px;background:linear-gradient(90deg,var(--blue),var(--vio));-webkit-background-clip:text;color:transparent}
.ib{background:none;border:none;color:var(--txt);font-size:22px;cursor:pointer;padding:6px 10px;border-radius:10px}
.bot{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;background:rgba(10,14,26,.95);border-top:1px solid var(--line);z-index:10}
.bot button{flex:1;background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer}
.bot button.on{color:var(--txt)}
main{max-width:540px;margin:auto;padding:12px}
.box{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.post{background:var(--s);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.ph{padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--vio));display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.pimg{width:100%;max-height:520px;object-fit:cover;display:block;background:#000}
.body{padding:10px 14px 14px}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:#2a1f4d;color:#c4b5fd;font-size:12px;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.chip{display:inline-block;background:var(--s2);border:1px solid var(--line);padding:3px 9px;border-radius:999px;font-size:12px;margin:2px}
.cm{font-size:14px;margin-top:4px}
.links{display:flex;gap:14px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.links button{background:none;border:none;color:var(--mut);cursor:pointer;padding:0;font-size:13px}
.links button:hover{color:var(--txt)}
input,textarea,select{width:100%;background:#0c1224;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.btn{background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;width:100%;font-weight:600;margin-top:4px}
.btn2{background:var(--s2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid div{aspect-ratio:1;background:var(--s2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;padding:6px;text-align:center}
.grid img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:86%;background:var(--s);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:21;padding:16px;overflow:auto}
.drawer.open{transform:none}
.drawer button.item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:11px 8px;border-radius:10px;cursor:pointer;font-size:15px}
.drawer button.item:hover{background:var(--s2)}
.ok{color:var(--ok);font-size:13px}
.err{color:var(--red);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thm{border:none;border-radius:12px;padding:16px 8px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer;min-height:64px;font-size:13px}
</style></head>
<body>
<canvas id="net"></canvas>
<input type="file" id="avfile" accept="image/*" style="display:none" onchange="avFile(this)">
<div id="lo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:center;justify-content:center;padding:16px"><div class="box" style="max-width:320px;width:100%;margin:0;text-align:center"><b>Are you sure you want to log out?</b><div style="display:flex;gap:8px;margin-top:14px"><button class="btn2" style="flex:1" onclick="askOut(false)">No</button><button class="btn" style="flex:1" onclick="askOut(true)">Yes</button></div></div></div>
<header class="top"><span class="logo">CodeConnect India</span><button class="ib" aria-label="Menu" onclick="drawer(true)">&#8942;</button></header>
<main id="app"><div class="empty">Loading...</div></main>
<nav class="bot" id="bot"></nav>
<div class="ov" id="ov" onclick="drawer(false)"></div>
<aside class="drawer" id="dr">
  <div class="mut" style="margin:6px 8px 10px">Menu</div>
  <button class="item" onclick="menu('reg')">Register as coder / Edit profile</button>
  <button class="item" onclick="menu('create')">Create post</button>
  <button class="item" onclick="menu('team')">AI Team Builder</button>
  <button class="item" onclick="menu('arena')">Skill Arena</button>
  <button class="item" onclick="menu('opps')">Opportunities</button>
  <button class="item" onclick="menu('rescue')">Project Rescue</button>
  <button class="item" onclick="menu('msgs')">Messages</button>
  <button class="item" onclick="menu('saved')">Saved posts</button>
  <button class="item" onclick="menu('reel')">Upload coding reel</button>
  <button class="item" onclick="menu('settings')">Settings &amp; Themes</button>
  <button class="item" onclick="menu('privacy')">Privacy &amp; Security</button>
  <button class="item" onclick="askLogout()">Log out</button>
</aside>

<script>
const OPPS=[{t:"Freelance: landing page",k:"React",x:"Freelance"},{t:"Internship: backend team",k:"Node.js",x:"Internship"},{t:"Hackathon: AI for health",k:"Python",x:"Hackathon"},{t:"Open source: docs fix",k:"JavaScript",x:"Open source"},{t:"Job: mobile developer",k:"Flutter",x:"Job"}];
let QS=[{q:"What does changing state in React cause?",o:["A re-render","Nothing","A full page reload"],a:0},{q:"Which SQL keyword enforces unique values?",o:["UNIQUE","SINGLE","ONLY"],a:0},{q:"How do you get a list's length in Python?",o:["size()","len()","count()"],a:1}];
const S={db:null,uid:null,prof:{},posts:[],tab:"home",loaded:false,pimg:null,pdone:false,ex:"",q:"",av:0,quiz:{i:0,sc:0,done:0},team:"",opq:"All",timer:null,lb:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=u=>S.prof[u]||{};
const blockedBy=()=>P(S.uid).blocked||[];
const nm=u=>u==="anon"?"Anonymous developer":(P(u).name||(u===S.uid?"You":"User"));
const ini=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const avat=u=>P(u).avatar?`<img src="${P(u).avatar}" alt="">`:esc(ini(nm(u)));
const hl=t=>esc(t).replace(/(#\w+)/g,'<span onclick="tagSearch(\'$1\')" style="cursor:pointer;color:#60a5fa">$1</span>').replace(/(@\w+)/g,'<span onclick="userSearch(\'$1\')" style="cursor:pointer;color:#60a5fa">$1</span>');
const chips=a=>(a||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("");

function menu(v){drawer(false);go(v)}
function drawer(o){$("dr").classList.toggle("open",o);$("ov").classList.toggle("open",o)}
function go(t){S.tab=t;render();window.scrollTo(0,0)}

function render(){
  const tabs=[["home","🏠"],["explore","🔍"],["msgs","💬"],["notif","🔔"],["profile","👤"]];
  $("bot").innerHTML=tabs.map(([k,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${i}</button>`).join("");
  if(!S.uid){$("app").innerHTML=signin();return}
  const v={home,explore,msgs,notif,profile,reg,create,reel,settings,saved:savedView,team,arena,opps,rescue,privacy}[S.tab]||home;
  const ids=["mi","ptx","psk","rvt","rvu","rvs","rn","ru","rc","rs","rg","rb","idea","pimgurl","ravurl","rex"];
  const keep={};ids.forEach(i=>{const el=$(i);if(el)keep[i]=el.value});
  $("app").innerHTML=v();
  ids.forEach(i=>{const el=$(i);if(el&&keep[i])el.value=keep[i]});
}

/* ---------- Sign in ---------- */
function signin(){
  return `<div class="box" style="margin-top:40px;text-align:center">
    <div class="logo" style="font-size:26px">CodeConnect India</div>
    <p class="mut">Find Coders. Showcase Skills. Build Together.</p>
    <p>Sign in to use CodeConnect. Your account is used only to identify you. Your password is never shared with this page.</p>
    <p class="mut">If you are not signed in, sign in from the page header or your browser, then reload this page.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px"><button class="btn" onclick="location.reload()">Log in</button><a class="btn2" href="https://claude.ai" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Sign up</a></div>
    <p class="mut" style="font-size:12px;margin-top:14px">Privacy: phone numbers and email are never shown in CodeConnect. Only the fields you choose are visible.</p></div>`;
}

/* ---------- Home ---------- */
function visible(p){return !blockedBy().includes(p.author)&&!(p.author!==S.uid&&P(p.author).privacy==="private"&&p.type!=="rescue")&&!(p.hidden)}
function home(){
  const feed=S.posts.filter(visible).filter(p=>(!S.fo||(P(S.uid).following||[]).includes(p.author)||p.author===S.uid)&&(!S.hq||(p.text||"").toLowerCase().includes(S.hq))).map(p=>{
    const mine=p.author===S.uid, L=p.likes||[];
    const cms=(p.cm||[]).map((c,i)=>`<div class="cm"><b>${esc(c.name)}</b> ${hl(c.t)}${c.by===S.uid?` <button class="btn2" style="padding:0 6px" onclick="delCm('${p.id}',${i})">delete</button>`:""}</div>`).join("");
    const label=p.type==="req"?"Requirement":p.type==="rescue"?"Project Rescue":p.type==="help"?"Anonymous help":p.type==="reel"?"Coding reel":"Post";
    return `<div class="post">
      <div class="ph"><div class="av">${p.author==="anon"?"?":avat(p.author)}</div><div><b>${esc(nm(p.author))}</b><div class="mut">${new Date(p.created).toLocaleDateString("en-IN")}</div></div></div>
      ${p.img?`<img class="pimg" src="${p.img}" alt="">`:""}
      <div class="body">
        <span class="tag">${label}</span>
        <div>${hl(p.text)}</div>
        ${p.videoUrl?`<div><a href="${esc(p.videoUrl)}" target="_blank" rel="noopener" style="color:#60a5fa">Watch video</a></div>`:""}
        ${(p.skills||[]).length?`<div style="margin-top:6px">${chips(p.skills)}</div>`:""}
        ${p.type==="req"||p.type==="rescue"||p.type==="help"?`<div class="mut">Matching coders: ${matchNames(p.skills||[])}</div>`:""}
        <div class="links"><button onclick="like('${p.id}')">${L.includes(S.uid)?'♥':'♡'} ${L.length} likes</button>
          <button onclick="sharePost('${p.id}')">Share</button> <button onclick="savePost('${p.id}')">${(P(S.uid).saved||[]).includes(p.id)?'Saved':'Save'}</button> ${mine?`<button onclick="delPost('${p.id}')">Delete</button>`:`<button onclick="report('${p.id}')">Report</button>`}
          ${mine||p.author==="anon"?"":`<button onclick="block('${p.author}')">Block user</button>`}</div>
        ${cms}
        <div style="display:flex;gap:6px;margin-top:8px"><input id="c${p.id}" placeholder="Write a comment..." style="margin:0" onkeydown="if(event.key==='Enter')cmt('${p.id}')"><button class="btn2" onclick="cmt('${p.id}')">Send</button></div>
      </div></div>`}).join("");
  const tc={};S.posts.forEach(p=>((p.text||"").match(/#\w+/g)||[]).forEach(t=>{const k=t.toLowerCase();tc[k]=(tc[k]||0)+1}));
  const trend=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="box"><button class="btn" onclick="go('create')">+ Create a post</button><div style="margin-top:8px"><button class="btn2" onclick="S.fo=0;render()">All</button> <button class="btn2" onclick="S.fo=1;render()">Following</button></div>${S.hq?`<div class="mut" style="margin-top:8px">Showing ${esc(S.hq)} <button class="btn2" onclick="S.hq=null;render()">Clear</button></div>`:""}<div style="margin-top:8px">${trend.map(([t,c])=>`<span class="chip" style="cursor:pointer" onclick="tagSearch('${t}')">${esc(t)} (${c})</span>`).join("")}</div></div>`+
    (feed||`<div class="empty">${S.loaded?"No posts yet. Be the first to post.":"Loading..."}</div>`);
}
async function like(id){const p=S.posts.find(x=>x.id===id),L=p.likes||[];const nl=L.includes(S.uid)?L.filter(x=>x!==S.uid):[...L,S.uid];await S.db.collection("posts").doc(id).update({likes:nl})}
async function cmt(id){const el=$("c"+id),t=el.value.trim();if(!t)return;const p=S.posts.find(x=>x.id===id);await S.db.collection("posts").doc(id).update({cm:[...(p.cm||[]),{by:S.uid,name:nm(S.uid),t}]});el.value=""}
async function delCm(id,i){const p=S.posts.find(x=>x.id===id);const c=(p.cm||[]).slice();if(c[i]&&c[i].by===S.uid){c.splice(i,1);await S.db.collection("posts").doc(id).update({cm:c})}}
async function delPost(id){const p=S.posts.find(x=>x.id===id);if(p.author!==S.uid)return alert("You can delete only your own posts.");if(confirm("Delete this post?"))await S.db.collection("posts").doc(id).delete()}
async function report(id){const p=S.posts.find(x=>x.id===id);const r=(p.reports||[]);if(r.includes(S.uid))return alert("You already reported this post.");await S.db.collection("posts").doc(id).update({reports:[...r,S.uid],hidden:r.length+1>=3});alert("Thanks. The post was reported for review.")}
async function block(u){if(!confirm("Block this user? You will stop seeing their posts."))return;const b=blockedBy();await S.db.collection("profiles").doc(S.uid).update({blocked:[...b,u]})}

/* ---------- Create post ---------- */
function create(){
  return `<div class="box"><b>Create a post</b>
  <select id="pt"><option value="post">Post (achievement, update, tutorial)</option><option value="req">Requirement (@coderconnectindia)</option><option value="rescue">Project Rescue (need help)</option><option value="help">Anonymous help question</option></select>
  <textarea id="ptx" rows="3" placeholder="Write something... #hashtag @mention"></textarea>
  <input id="psk" placeholder="Skills needed, comma separated (for requirement and rescue)">
  <input type="file" accept="image/*" onchange="pick(this)">
  <input id="pimgurl" placeholder="Or paste a photo link (https://...)">
  <div id="pmsg" class="err"></div>
  <button class="btn" onclick="addPost()">Publish</button></div>`;
}
async function pick(el){const f=el.files[0],m=$("pmsg");if(!f)return;if(m){m.className="mut";m.textContent="Processing photo..."}try{S.pimg=await compress(f);if(m){m.className="ok";m.textContent="Photo ready: "+f.name}}catch(e){S.pimg=null;if(m){m.className="err";m.textContent="This file could not be read. Try a JPG or PNG."}}}
function compress(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
async function addPost(){
  const type=$("pt").value,text=$("ptx").value.trim(),skills=$("psk").value.split(",").map(s=>s.trim()).filter(Boolean);
  const iu=$("pimgurl")?$("pimgurl").value.trim():"";const img=S.pimg||(/^https:\/\//.test(iu)?iu:null);
  if(!text&&!img)return $("pmsg").textContent="Please add text or a photo.";
  if((type==="req"||type==="rescue")&&!skills.length)return $("pmsg").textContent="Add at least one skill.";
  try{await S.db.collection("posts").add({author:type==="help"?"anon":S.uid,type,text,img,skills,likes:[],cm:[],reports:[],created:Date.now()});S.pimg=null;go("home")}
  catch(e){$("pmsg").textContent="Could not save: "+(e.message||e)}
}

/* ---------- Explore ---------- */
function explore(){
  const list=Object.entries(S.prof).filter(([u,p])=>p.type==="coder"&&p.privacy!=="private"&&!blockedBy().includes(u)&&u!==S.uid)
    .filter(([u,p])=>!S.av||p.avail).filter(([u,p])=>!S.ex||(p.username+" "+p.name+" "+(p.city||"")+" "+(p.skills||[]).join(" ")).toLowerCase().includes(S.ex.replace("@","").toLowerCase())).sort(sortCoders);
  return `<div class="box"><input placeholder="Search by name, @username, city or skill" value="${esc(S.ex)}" oninput="S.ex=this.value;render();$('app').querySelector('input').focus()">
    <label class="mut"><input type="checkbox" style="width:auto" ${S.av?"checked":""} onchange="S.av=this.checked?1:0;render()"> Available only</label> <select style="width:auto" onchange="S.so=this.value;render()"><option value="name">Sort: Name</option><option value="city">Sort: City</option><option value="exp">Sort: Experience</option><option value="new">Sort: Newest</option></select></div>
  ${list.map(([u,p])=>`<div class="box"><div style="display:flex;gap:10px;align-items:center"><div class="av">${avat(u)}</div><div style="flex:1"><b>${esc(p.name)}</b> <span class="mut">@${esc(p.username||"")} - ${esc(p.city||"")}</span><div class="mut">${p.avail?"Available":"Busy"}${p.github?" - github.com/"+esc(p.github):""}</div></div>
  <button class="btn2" onclick="toggleFollow('${u}')">${isFol(u)?"Following":"Follow"}</button> <button class="btn2" onclick="openChat('${u}')">Message</button> <button class="btn2" onclick="block('${u}')">Block</button></div>
  <div style="margin-top:8px">${chips(p.skills)}</div><p class="mut" style="margin-bottom:0">${esc(p.bio||"")}</p></div>`).join("")||`<div class="empty">No public coders match. Register or change the filters.</div>`}`;
}

/* ---------- Notifications ---------- */
function notif(){
  const items=[];
  S.posts.filter(p=>p.author===S.uid).forEach(p=>{
    (p.likes||[]).filter(u=>u!==S.uid).forEach(u=>items.push(`${nm(u)} liked your post`));
    (p.cm||[]).filter(c=>c.by!==S.uid).forEach(c=>items.push(`${c.name} commented: ${c.t}`));
  });
  followersOf(S.uid).forEach(u=>items.push(`${nm(u)} started following you`));
  return `<div class="box"><b>Notifications</b></div>`+(items.map(t=>`<div class="box" style="color:var(--txt)">${esc(t)}</div>`).join("")||`<div class="empty">No notifications yet.</div>`);
}

/* ---------- Profile ---------- */
function profile(){
  const p=P(S.uid),mine=S.posts.filter(x=>x.author===S.uid);
  return `<div class="box" style="display:flex;gap:14px;align-items:center">
    <div style="position:relative"><div class="av" style="width:72px;height:72px;font-size:24px">${avat(S.uid)}</div><button onclick="toggleAv()" aria-label="Change profile photo" style="position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:var(--blue);color:#fff;cursor:pointer;font-size:12px;padding:0">&#128247;</button></div>
    <div style="flex:1"><b style="font-size:18px">${esc(p.name||"Set your name")}</b>
    <div class="mut">@${esc(p.username||"set-username")} - ${p.type==="coder"?"Coder":"User"}${p.city?" - "+esc(p.city):""}</div>
    <div class="mut">${followersOf(S.uid).length} followers - ${(p.following||[]).length} following</div>
    <div class="mut">${mine.length} posts - Profile ${p.privacy==="private"?"private":"public"}</div></div></div>
  <div class="box"><p style="margin:0">${esc(p.bio||"No bio yet.")}</p><div style="margin-top:8px">${chips(p.skills)}</div>
  <p class="mut">${p.github?"GitHub: github.com/"+esc(p.github):""}</p>
  <button class="btn2" style="width:100%" onclick="go('reg')">Edit profile</button><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="go('create')">+ Create post</button><button class="btn2" onclick="go('reel')">+ Coding reel</button></div></div>
  ${S.avs?avSheet():""}${followList()}<div class="grid">${mine.map(x=>`<div>${x.img?`<img src="${x.img}" alt="">`:esc((x.text||"").slice(0,60))}</div>`).join("")}</div>
  ${mine.length?"":`<div class="empty">You have not posted yet.</div>`}`;
}

/* ---------- Register / edit profile ---------- */
function reg(){
  const p=P(S.uid);
  return `<div class="box"><b>Register as coder / Edit profile</b>
  <input id="rn" placeholder="Full name" value="${esc(p.name||"")}">
  <input id="ru" placeholder="Username (3-20 letters, numbers or _)" value="${esc(p.username||"")}">
  <select id="rt"><option value="coder" ${p.type!=="user"?"selected":""}>Coder / Developer</option><option value="user" ${p.type==="user"?"selected":""}>Normal user</option></select>
  <input id="rc" placeholder="City" value="${esc(p.city||"")}">
  <input id="rex" type="number" min="0" max="60" placeholder="Years of experience" value="${esc(p.exp||"")}">
  <input id="rs" placeholder="Skills, comma separated (e.g. React, Python)" value="${esc((p.skills||[]).join(", "))}">
  <input id="rg" placeholder="GitHub username" value="${esc(p.github||"")}">
  <textarea id="rb" rows="3" placeholder="Bio">${esc(p.bio||"")}</textarea>
  <label class="mut"><input type="checkbox" id="ra" style="width:auto" ${p.avail?"checked":""}> Available for work</label>

function buildTeam(){

function avSheet(){return `<div class="box"><b>Choose profile photo</b><div style="display:flex;gap:8px;margin:10px 0"><label class="btn" style="position:relative;overflow:hidden;text-align:center;margin:0;flex:1">Gallery<input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer" onchange="avFile(this)"></label><button class="btn2" onclick="S.avai=!S.avai;render()">Avatars</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="avurl" placeholder="Or paste a photo link (https://...)" style="margin:0"><button class="btn2" onclick="avLink()">Use</button></div>${S.avai?`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${CODE_AV.map((s,i)=>`<img src="${s}" alt="" style="width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer" onclick="saveAvI(${i})">`).join("")}</div>`:""}</div>`}

/* ---------- Log out ---------- */
function askLogout(){drawer(false);$("lo").style.display="flex"}
function askOut(y){$("lo").style.display="none";if(y)signOut()}
function signOut(){drawer(false);S.uid=null;S.prof={};S.posts=[];S.chats=[];S.chatWith=null;render()}

/* ---------- Follow ---------- */
const isFol=u=>(P(S.uid).following||[]).includes(u);
const followersOf=u=>Object.entries(S.prof).filter(([k,p])=>(p.following||[]).includes(u)).map(([k])=>k);
async function toggleFollow(u){
  if(!P(S.uid).name)return alert("Register your profile first to follow coders.");
  const f=P(S.uid).following||[];
  const nf=f.includes(u)?f.filter(x=>x!==u):[...f,u];
  try{await S.db.collection("profiles").doc(S.uid).update({following:nf})}catch(e){alert("Could not update: "+(e.message||e))}
}
function followList(){
  const f=P(S.uid).following||[],fr=followersOf(S.uid);
  return `<div class="box"><b>Following (${f.length})</b>${f.map(u=>`<div style="display:flex;justify-content:space-between;margin-top:8px"><span>${esc(nm(u))} <span class="mut">@${esc(P(u).username||"")}</span></span><button class="btn2" onclick="toggleFollow('${u}')">Unfollow</button></div>`).join("")||`<p class="mut">You follow no one yet.</p>`}</div>
  <div class="box"><b>Followers (${fr.length})</b>${fr.map(u=>`<div style="margin-top:8px">${esc(nm(u))} <span class="mut">@${esc(P(u).username||"")}</span></div>`).join("")||`<p class="mut">No followers yet.</p>`}</div>`;
}

/* ---------- Messages (one-to-one) ---------- */
const cid=o=>[S.uid,o].sort().join("_");
function openChat(o){S.chatWith=o;go("msgs")}
function msgs(){
  if(S.chatWith)return chat(S.chatWith);
  const list=(S.chats||[]).map(c=>{const o=c.participants.find(x=>x!==S.uid)||"";const last=(c.msgs||[]).slice(-1)[0];return `<div class="box" style="cursor:pointer" onclick="openChat('${o}')"><b>${esc(nm(o))}</b><div class="mut">${esc(last?last.t:"")}</div></div>`}).join("");
  return `<div class="box"><b>Messages</b> <span class="mut">One-to-one chat</span></div>`+(list||`<div class="empty">No conversations yet. Open Explore and tap Message.</div>`);
}
function chat(o){
  const c=(S.chats||[]).find(x=>x.id===cid(o))||{msgs:[]};
  const blocked=blockedBy().includes(o)||(P(o).blocked||[]).includes(S.uid);
  return `<div class="box"><button class="btn2" onclick="S.chatWith=null;render()">Back</button> <b>${esc(nm(o))}</b></div>
  <div class="box" style="min-height:200px">${(c.msgs||[]).map(m=>`<div class="cm" style="${m.f===S.uid?'text-align:right;color:#c4b5fd':''}">${esc(m.t)}</div>`).join("")||'<div class="mut">Say hello.</div>'}</div>
  ${blocked?`<div class="box mut">You cannot message this user.</div>`:`<div style="display:flex;gap:6px"><input id="mi" placeholder="Type a message" style="margin:0" onkeydown="if(event.key==='Enter')sendMsg('${o}')"><button class="btn2" onclick="sendMsg('${o}')">Send</button></div>`}
  <p class="mut" style="font-size:12px">Messages are stored in the shared database. Do not share passwords or sensitive data here.</p>`;
}
async function sendMsg(o){
  const el=$("mi"),t=el.value.trim();if(!t)return;
  if(blockedBy().includes(o)||(P(o).blocked||[]).includes(S.uid))return alert("You cannot message this user.");
  const id=cid(o),c=(S.chats||[]).find(x=>x.id===id);
  const m=[...((c&&c.msgs)||[]),{f:S.uid,t,at:Date.now()}].slice(-200);
  try{await S.db.collection("chats").doc(id).set({participants:[S.uid,o].sort(),msgs:m,updated:Date.now()});el.value=""}
  catch(e){alert("Message not sent: "+(e.message||e))}
}

/* ---------- Boot ---------- */
(async()=>{
  const c=window.claude;
  const db=c?await c.use("db"):null;
  const user=c?await c.use("user"):null;
  S.uid=user?await user.id():null;
  S.db=db;
  if(!db||!S.uid){S.loaded=true;render();return}
  S.timer=setTimeout(()=>{if(!S.loaded)$("app").insertAdjacentHTML("afterbegin",'<div class="box mut">Data is not reachable yet. It will retry automatically.</div>')},10000);
  db.collection("profiles").onSnapshot(s=>{S.prof={};s.docs.forEach(d=>{if(d.exists)S.prof[d.id]=d.data()});S.loaded=true;clearTimeout(S.timer);S.lb=Object.entries(S.prof).filter(([u,p])=>p.arena!==undefined).map(([u,p])=>({n:p.name||"Coder",s:p.arena}));if(!S.thSynced&&P(S.uid).theme!==undefined){S.thSynced=1;S.th=P(S.uid).theme;applyTheme()}render()},e=>console.error(e));
  db.collection("posts").orderBy("created","desc").limit(100).onSnapshot(s=>{S.posts=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));S.loaded=true;render()},e=>console.error(e));
  db.collection("chats").where("participants","array-contains",S.uid).onSnapshot(s=>{S.chats=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updated||0)-(a.updated||0));render()},e=>console.error(e));
  render();
})();

/* ---------- Networking background ---------- */
(function(){const c=$("net"),x=c.getContext("2d");let Q=[],W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;Q=Array.from({length:Math.min(60,Math.floor(W*H/20000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
function f(){x.clearRect(0,0,W,H);aurora();Q.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){const a=Q[i],b=Q[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle=`rgba(59,130,246,${.25*(1-d/130)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
Q.forEach(p=>{x.fillStyle="rgba(139,92,246,.8)";x.beginPath();x.arc(p.x,p.y,1.8,0,7);x.fill()});requestAnimationFrame(f)}
addEventListener("resize",rs);rs();f()})();

applyTheme();render();
